<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Skidline has moved</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://skidline.edward7780.com/" />
    <script>
      // The game now lives on Vercel. Keep whatever came after the repo's
      // path (/skidline/, /neon-apex/ before the rename), plus the query and
      // hash, so old shared track links still work.
      var rest = location.pathname.replace(/^\/(skidline|neon-apex)\/?/, '')
      location.replace('https://skidline.edward7780.com/' + rest + location.search + location.hash)
    </script>
    <meta http-equiv="refresh" content="1; url=https://skidline.edward7780.com/" />
  </head>
  <body>
    <p>Skidline is now at <a href="https://skidline.edward7780.com/">skidline.edward7780.com</a>.</p>
  </body>
</html>
